{% extends "base.html" %}

{% block title %}Admin Login - Code, Bid & Build{% endblock %}

{% block content %}
<div class="admin-login-container">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-6 col-sm-8">
                <div class="card admin-login-card shadow-lg animate__animated animate__zoomIn">
                    <div class="card-body p-5">
                        <!-- Header -->
                        <div class="text-center mb-4">
                            <div class="login-icon mb-3">
                                <i class="fas fa-lock"></i>
                            </div>
                            <h2 class="card-title fw-bold mb-2">Admin Panel</h2>
                            <p class="text-muted">Secure access for event administrators</p>
                        </div>

                        <!-- Login Form -->
                        <form method="POST" action="{{ url_for('admin_login') }}" novalidate>
                            <div class="mb-4">
                                <label for="username" class="form-label fw-600">
                                    <i class="fas fa-user"></i> Username
                                </label>
                                <input type="text" class="form-control form-control-lg" id="username" 
                                       name="username" placeholder="Enter username" required autofocus>
                            </div>

                            <div class="mb-4">
                                <label for="password" class="form-label fw-600">
                                    <i class="fas fa-key"></i> Password
                                </label>
                                <input type="password" class="form-control form-control-lg" id="password" 
                                       name="password" placeholder="Enter password" required>
                            </div>

                            <div class="d-grid gap-2 mb-4">
                                <button type="submit" class="btn btn-primary btn-lg fw-bold">
                                    <i class="fas fa-sign-in-alt"></i> Login
                                </button>
                            </div>

                            <div class="alert alert-info small" role="alert">
                            
                            </div>
                        </form>

                        <!-- Back to Home -->
                        <div class="text-center">
                            <a href="{{ url_for('index') }}" class="text-decoration-none">
                                <i class="fas fa-arrow-left"></i> Back to Registration
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Security Notice -->
                <div class="alert alert-warning mt-4 animate__animated animate__fadeInUp" role="alert">
                    <i class="fas fa-shield-alt"></i>
                    <strong>Security Notice:</strong> Change the default credentials in production.
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
